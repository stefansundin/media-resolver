[package]
name = "media-resolver"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
actix-web = "4.12.1"
config = { version = "0.15.19", features = ["toml"], default-features = false }
env_logger = "0.11.8"
http = "1.4.0"
log = "0.4.29"
regex = "1.12.2"
reqwest = { version = "0.13.1", features = ["json", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
urlencoding = "2.1.3"

[[bin]]
name = "media-resolver"
path = "src/main.rs"
